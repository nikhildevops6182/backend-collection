
name: Java Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, myrunner]

    env:
      DOCKER_IMAGE: snk6182/backend-collection:v1

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 3. Build Java application
      - name: Maven Clean Package
        run: mvn clean package

      # 4. Verify Docker credentials
      - name: Verify Docker Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e
          test -n "$DOCKER_USERNAME" || {
            echo "Docker username is missing"
            exit 1
          }
          test -n "$DOCKER_PASSWORD" || {
            echo "Docker password is missing"
            exit 1
          }
          echo "Docker credentials are available"

      # 5. Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build Docker image
      - name: Docker Build
        run: |
          docker build -t $DOCKER_IMAGE .

      # 7. Push Docker image
      - name: Docker Push
        run: |
          docker push $DOCKER_IMAGE

      # 8. Configure Kubernetes kubeconfig
      - name: Configure Kubernetes kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -e

          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "Kubernetes kubeconfig secret is missing"
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "Checking Kubernetes connection..."
          kubectl config current-context
          kubectl get nodes

      # 9. Deploy backend to Kubernetes
      - name: Deploy Kubernetes Application
        run: |
          set -e

          kubectl apply -f deployment.yml
          kubectl apply -f service.yml

          kubectl set image deployment/backend-deployment \
            backend-app=$DOCKER_IMAGE

          kubectl rollout status deployment/backend-deployment \
            --timeout=180s

      # 10. Verify Kubernetes deployment
      - name: Verify Deployment
        run: |
          echo "Deployment status:"
          kubectl get deployments

          echo "Pod status:"
          kubectl get pods -o wide

          echo "Service status:"
          kubectl get services

      # 11. Docker logout
      - name: Docker Logout
        if: always()
        run: docker logout
